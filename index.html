<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRUB</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
  .logo { font-size: 48px; font-weight: 900; letter-spacing: -2px; color: #ff3a00; margin-bottom: 8px; }
  .sub { font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 48px; }
  .search-wrap { display: flex; gap: 8px; width: 100%; max-width: 560px; margin-bottom: 16px; }
  input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 14px 18px; color: #fff; font-family: monospace; font-size: 13px; outline: none; }
  input::placeholder { color: rgba(255,255,255,0.3); }
  input:focus { border-color: rgba(255,58,0,0.5); }
  button { background: #ff3a00; color: #fff; border: none; border-radius: 8px; padding: 14px 24px; font-family: monospace; font-size: 13px; font-weight: 700; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; transition: opacity 0.2s; }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 1px; min-height: 20px; text-align: center; }
  .status.active { color: #ff3a00; }
  .status.done { color: #00ff88; }
  .status.error { color: #ff5252; }
  .download-btn { margin-top: 24px; background: transparent; border: 1px solid #00ff88; color: #00ff88; display: none; }
  .download-btn.visible { display: block; }
  .hint { margin-top: 48px; font-size: 10px; color: rgba(255,255,255,0.2); text-align: center; line-height: 1.8; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="logo">GRUB</div>
<div class="sub">sample hunter</div>
<div class="search-wrap">
  <input id="q" type="text" placeholder="artist — title or paste a spotify / tidal link" />
  <button id="pullBtn" onclick="pull()">PULL</button>
</div>
<div id="status" class="status"></div>
<button id="dlBtn" class="download-btn" onclick="triggerDownload()">↓ DOWNLOAD</button>
<div class="hint">spotdl → yt-dlp · flac when available · mp3 fallback</div>
<script>
let currentJobId = null;
let pollInterval = null;
async function pull() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const btn = document.getElementById('pullBtn');
  const dlBtn = document.getElementById('dlBtn');
  btn.disabled = true;
  dlBtn.classList.remove('visible');
  currentJobId = null;
  setStatus('starting...', 'active');
  try {
    const res = await fetch('/api/pull', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query: q }) });
    const data = await res.json();
    if (data.error) { setStatus(data.error, 'error'); btn.disabled = false; return; }
    currentJobId = data.job_id;
    startPolling();
  } catch(e) { setStatus('server error', 'error'); btn.disabled = false; }
}
function startPolling() {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async () => {
    if (!currentJobId) return;
    try {
      const res = await fetch('/api/status/' + currentJobId);
      const data = await res.json();
      if (data.status === 'done') {
        clearInterval(pollInterval);
        setStatus('ready — ' + (data.filename || ''), 'done');
        document.getElementById('dlBtn').classList.add('visible');
        document.getElementById('pullBtn').disabled = false;
      } else if (data.status === 'error') {
        clearInterval(pollInterval);
        setStatus(data.error || 'failed', 'error');
        document.getElementById('pullBtn').disabled = false;
      } else { setStatus(data.status, 'active'); }
    } catch(e) {}
  }, 1500);
}
function triggerDownload() {
  if (!currentJobId) return;
  window.location.href = '/api/download/' + currentJobId;
}
function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (type || '');
}
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') pull(); });
</script>
</body>
</html>
